<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calorie Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">

    <!-- Top Bar -->
    <header class="app-header">
      <div class="app-header-left">
        <div class="user-avatar" id="user-avatar"></div>
        <div class="app-header-title">
          <span class="app-title">Calorie Tracker</span>
          <span class="user-name" id="user-name"></span>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="ring-mini">
        <svg class="ring-svg" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52" />
        </svg>
        <span class="ring-mini-pct" id="progress-pct">0%</span>
      </div>
      <div class="stat-chips">
        <div class="stat-chip stat-chip-violet" id="card-goal">
          <span class="stat-chip-label">Obiettivo</span>
          <span class="stat-chip-value" id="goal-value">--</span>
        </div>
        <div class="stat-chip stat-chip-orange">
          <span class="stat-chip-label">Consumate</span>
          <span class="stat-chip-value" id="consumed-value">--</span>
        </div>
        <div class="stat-chip stat-chip-green" id="card-remaining">
          <span class="stat-chip-label">Rimanenti</span>
          <span class="stat-chip-value" id="remaining-value">--</span>
        </div>
      </div>
      <button class="stat-goal-btn" id="goal-btn" title="Modifica obiettivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
    </div>

    <!-- Goal Modal -->
    <div class="modal-overlay" id="goal-modal">
      <div class="modal-card">
        <div class="modal-title">Obiettivo giornaliero</div>
        <form id="goal-form" class="modal-form">
          <div class="modal-field">
            <input type="text" id="goal-input" inputmode="numeric" pattern="[0-9]*" placeholder="2200" autocomplete="off" required>
            <span class="modal-field-unit">kcal</span>
          </div>
          <div class="modal-actions">
            <button type="button" class="modal-btn-cancel" id="goal-cancel">Annulla</button>
            <button type="submit" class="modal-btn-confirm">Imposta</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Hidden progress bar for JS compat -->
    <div style="display:none"><div class="progress-bar" id="progress-bar"></div></div>

    <!-- Tab Content -->
    <main class="app-main">
      <!-- Tab: Chat -->
      <div class="tab-panel active" id="panel-chat">
        <div class="pepis-chat">
          <div class="pepis-messages" id="pepis-messages">
            <div class="pepis-welcome" id="pepis-welcome">
              <div class="pepis-welcome-emoji">&#127798;&#65039;</div>
              <h3 class="pepis-welcome-title">Ciao! Sono Pepis</h3>
              <p class="pepis-welcome-sub">Dimmi cosa hai mangiato e calcoler&#242; le calorie per te!</p>
            </div>
          </div>
          <div class="pepis-input-area">
            <div class="meal-chips" id="meal-chips">
              <button type="button" class="meal-chip" data-meal="colazione">&#127749; Colazione</button>
              <button type="button" class="meal-chip active" data-meal="pranzo">&#127869;&#65039; Pranzo</button>
              <button type="button" class="meal-chip" data-meal="cena">&#127769; Cena</button>
              <button type="button" class="meal-chip" data-meal="spuntino">&#127822; Spuntino</button>
            </div>
            <form id="chat-form" class="pepis-form">
              <input type="text" id="chat-input" class="pepis-input" placeholder="Es: pasta al pomodoro, 200g" autocomplete="off" required>
              <button type="submit" class="pepis-send" id="chat-send" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Tab: Entries -->
      <div class="tab-panel" id="panel-entries">
        <div class="entries-panel">
          <div class="entries-panel-header">
            <h2>Pasti di oggi</h2>
            <button id="reset-btn" class="btn-ghost-danger">Reset</button>
          </div>
          <div class="entries-scroll">
            <div id="entries-list"></div>
            <div id="empty-msg" class="empty-state">
              <div class="empty-icon">&#127869;</div>
              <p>Nessun pasto registrato</p>
              <span>Chiedi a Pepis di calcolare le calorie</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Tab Bar -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span>Pepis</span>
        <div class="tab-indicator"></div>
      </button>
      <button class="tab-btn" data-tab="entries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        <span>Pasti</span>
        <span class="tab-badge" id="entries-badge"></span>
        <div class="tab-indicator"></div>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
